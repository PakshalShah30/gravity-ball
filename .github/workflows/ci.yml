name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # No npm install: the project has zero dependencies.
      - run: npm test
      - name: Upload scenario screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scenario-screenshots
          path: out/scenarios
          if-no-files-found: ignore
